<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ee; --dot: #d9d5cc; --card: #ffffff; --ink: #1d1c1a; --muted: #75716a; --line: #e6e2da;
  --shadow: 0 1px 2px rgba(30,25,15,.06), 0 6px 18px rgba(30,25,15,.07);
  --lift: 0 2px 4px rgba(30,25,15,.08), 0 18px 40px rgba(30,25,15,.16);
  --planned: #a9a49a; --working: #3b82f6; --waiting: #f59e0b; --approved: #16a34a; --live: #b8b3a9; --proposal: #8b5cf6;
  --container: rgba(255,255,255,.42); --container-line: rgba(120,110,95,.18);
  --dim: rgba(28,24,18,.34); --panel: #ffffff; --chip: #f1eee8; --badge: #ef4444;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151412; --dot: #2b2925; --card: #1f1e1b; --ink: #eeeae3; --muted: #a39e94; --line: #34312c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --lift: 0 18px 44px rgba(0,0,0,.6);
  --container: rgba(255,255,255,.035); --container-line: rgba(255,255,255,.09);
  --dim: rgba(0,0,0,.5); --panel: #1c1b18; --chip: #2a2825; --live: #5d5953; --planned: #6f6a62;
} }
:root[data-theme="dark"] {
  --bg: #151412; --dot: #2b2925; --card: #1f1e1b; --ink: #eeeae3; --muted: #a39e94; --line: #34312c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --lift: 0 18px 44px rgba(0,0,0,.6);
  --container: rgba(255,255,255,.035); --container-line: rgba(255,255,255,.09);
  --dim: rgba(0,0,0,.5); --panel: #1c1b18; --chip: #2a2825; --live: #5d5953; --planned: #6f6a62;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* ---------- canvas ---------- */
#viewport { position: fixed; inset: 0; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

.item { position: absolute; }
.project { border-radius: 26px; background: var(--container); border: 1.5px solid var(--container-line);
  backdrop-filter: blur(2px); }
.project > .head { position: absolute; left: 0; right: 0; top: 0; height: 58px; padding: 16px 22px;
  display: flex; align-items: center; gap: 10px; cursor: pointer; }
.project > .head .ttl { font-weight: 700; letter-spacing: -.01em;
  font-size: 17px; white-space: nowrap; }
.project > .head .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.project > .head .progress { margin-left: auto; font-size: 12px; color: var(--muted); }

.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px 12px 18px;
  cursor: pointer; overflow: visible; transition: box-shadow .2s, transform .2s, opacity .25s; user-select: none; }
.card:hover { box-shadow: var(--lift); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); border-radius: 14px 0 0 14px; }
.card .kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.card .ttl { font-weight: 600; margin-top: 3px; letter-spacing: -.005em;
  font-size: 15px; line-height: 1.22; }
.card .meta { margin-top: 6px; color: var(--muted); font-size: 12.5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .ttl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .state { position: absolute; left: 18px; bottom: 11px; font-size: 11.5px; font-weight: 600; color: var(--c); display: flex; align-items: center; gap: 6px; }
.card.feature { width: 300px; height: 136px; }
.card.bugfix { width: 230px; height: 104px; }
.card.bugfix .meta { display: none; }
.card.chip { width: 196px; height: 64px; padding-top: 10px; }
.card.chip .meta, .card.chip .state, .card.chip .kind { display: none; }
.card.chip .ttl { font-size: 13px; font-weight: 500; }

.s-planned { --c: var(--planned); } .s-working { --c: var(--working); } .s-waiting { --c: var(--waiting); }
.s-approved { --c: var(--approved); } .s-live { --c: var(--live); } .s-proposal { --c: var(--proposal); }
.card.s-live { opacity: .72; }
.card.s-live .ttl { font-weight: 500; }
.card.s-proposal { background: transparent; box-shadow: none; border: 2px dashed var(--proposal); }
.card.s-proposal::before { display: none; }
.card.s-waiting { box-shadow: 0 0 0 2px var(--waiting), var(--shadow); }
.card.s-working .state::after { content: ""; width: 34px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--working), transparent); background-size: 200% 100%;
  animation: flow 1.4s linear infinite; }
@keyframes flow { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.badge { position: absolute; top: -9px; right: -9px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px;
  background: var(--waiting); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
  box-shadow: 0 0 0 3px var(--bg); transform: scale(max(1, calc(.9 / var(--s)))); transform-origin: 70% 30%; }
.badge.pulse { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 3px var(--bg), 0 0 0 3px rgba(245,158,11,.55); }
  70% { box-shadow: 0 0 0 3px var(--bg), 0 0 0 16px rgba(245,158,11,0); } 100% { box-shadow: 0 0 0 3px var(--bg), 0 0 0 16px rgba(245,158,11,0); } }
.card.lifted { opacity: 0; }
.card.pop { animation: pop .55s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card.flash { animation: flash 1.2s ease-out 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 45%, transparent), var(--lift); } }

/* semantic zoom */
body.z-far .card .meta, body.z-far .card .kind, body.z-far .card .state, body.z-far .project .progress { display: none; }
body.z-far .card { padding-top: 16px; }
body.z-far .card.chip { opacity: .45; }

#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke: var(--proposal); stroke-width: 2; stroke-dasharray: 5 6; opacity: .7; }

/* ---------- chrome ---------- */
#bar { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 20; }
#bar > * { pointer-events: auto; }
.pill { background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.pill b { font-weight: 600; }
#attention { margin-left: auto; cursor: pointer; border: 0; }
#attention .n { background: var(--waiting); color: #fff; border-radius: 10px; padding: 0 7px; font-weight: 700; font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.mock { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

#edges { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
.edge { position: absolute; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px;
  background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 5px 11px 5px 7px; font-size: 12px; font-weight: 500;
  transform: translate(-50%, -50%); white-space: nowrap; transition: opacity .2s; }
.edge .arr { width: 20px; height: 20px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; }

#minimap { position: fixed; right: 14px; bottom: 14px; width: 210px; height: 130px; background: var(--card); border-radius: 12px;
  box-shadow: var(--shadow); z-index: 20; cursor: pointer; overflow: hidden; }
#minimap svg { width: 100%; height: 100%; display: block; }

/* ---------- focus: dim + panel + plan sheet ---------- */
#dim { position: fixed; inset: 0; background: var(--dim); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 30; }
#dim.on { opacity: 1; pointer-events: auto; }
#panel { position: fixed; z-index: 40; background: var(--panel); border-radius: 14px; box-shadow: var(--lift); overflow: hidden; display: none; }
#panel.anim { transition: left .42s cubic-bezier(.3,.9,.3,1), top .42s cubic-bezier(.3,.9,.3,1), width .42s cubic-bezier(.3,.9,.3,1),
  height .42s cubic-bezier(.3,.9,.3,1), border-radius .42s; }
#panel .inner { position: absolute; inset: 0; overflow: auto; padding: 26px 30px 90px; opacity: 0; transition: opacity .2s; }
#panel.ready .inner { opacity: 1; transition-delay: .08s; }
#panel .close { position: absolute; right: 14px; top: 12px; border: 0; background: var(--chip); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 2; }
#panel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); z-index: 1; }
.p-kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.p-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 6px; }
.p-state { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--c); }
.p-lead { font-size: 16px; max-width: 72ch; margin: 12px 0 18px; }
.p-grid { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; align-items: start; }
.p-grid video { width: 100%; border-radius: 10px; background: #000; display: block; }
.chapters { list-style: none; margin: 0; padding: 6px; background: var(--chip); border-radius: 10px; }
.chapters button { all: unset; cursor: pointer; display: flex; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 7px; font-size: 13px; box-sizing: border-box; }
.chapters button:hover, .chapters button.on { background: var(--card); }
.chapters .t { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; }
.question { margin: 18px 0; padding: 14px 18px; border-radius: 12px; border: 1.5px solid var(--waiting);
  background: color-mix(in srgb, var(--waiting) 9%, transparent); font-size: 15px; }
.question h4, .cols h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.cols section { background: var(--chip); border-radius: 12px; padding: 12px 16px; font-size: 13px; }
.cols ul { margin: 0; padding-left: 18px; } .cols li { margin: 3px 0; }
.say { margin-top: 18px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.say kbd { font: 600 11px Inter, sans-serif; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink); background: var(--card); }
.log { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
.log div { opacity: .85; } .log div:last-child { opacity: 1; font-weight: 600; }
.log div:last-child::after { content: "▍"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.opts button { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.opts button:hover { border-color: var(--ink); }
.actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 600; cursor: pointer; background: var(--chip); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn:hover { filter: brightness(1.08); }

#sheet { position: fixed; top: 64px; right: 14px; bottom: 158px; width: 380px; background: var(--panel); border-radius: 16px; box-shadow: var(--lift);
  z-index: 25; transform: translateX(calc(100% + 30px)); transition: transform .45s cubic-bezier(.3,.9,.3,1); overflow: auto; padding: 22px 22px 30px; }
#sheet.on { transform: none; }
#sheet h2 { margin: 2px 0 8px; font-size: 20px; letter-spacing: -.01em; }
#sheet .goal { font-size: 13.5px; color: var(--ink); opacity: .9; }
#sheet .src { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 8px; }
#sheet ol { list-style: none; padding: 0; margin: 16px 0 0; }
#sheet li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; }
#sheet li:hover { background: var(--chip); }
#sheet li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 5px; flex: none; }
#sheet li .w { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 30px; }

/* ---------- push to talk ---------- */
#ptt { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#mic { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--lift); cursor: pointer; display: grid; place-items: center; position: relative; }
#mic svg { width: 24px; height: 24px; }
#mic .ring { position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--waiting); opacity: 0; transform: scale(var(--lvl, 1)); transition: transform .08s linear, opacity .2s; }
#ptt.listening #mic { background: var(--waiting); color: #fff; }
#ptt.listening #mic .ring { opacity: .8; }
#ptt.thinking #mic::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--working); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#target { font-size: 12px; color: var(--muted); background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
#target b { color: var(--ink); font-weight: 600; }
#ack { position: fixed; left: 50%; bottom: 128px; transform: translate(-50%, 12px); z-index: 60; background: var(--ink); color: var(--bg);
  border-radius: 14px; padding: 12px 16px; max-width: min(560px, calc(100vw - 32px)); font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; display: flex; gap: 14px; align-items: center; }
#ack.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#ack button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 8px; padding: 3px 10px; cursor: pointer; flex: none; }
@media (max-width: 760px) { #minimap { display: none; } .p-grid, .cols { grid-template-columns: 1fr; } #sheet { width: auto; left: 14px; } }
</style>
</head>

      const right = innerWidth - (focus ? 410 : 0) - m;

      ${say('Feedback geben, die offene Frage beantworten oder freigeben.')}`;
  }
  if (i.need === 'question') return `${head}<p class="p-lead">${i.meta || ''}</p><div class="question"><h4>Frage des Agenten</h4>${i.question}
      <div class="opts">${i.options.map((o) => `<button data-answer="${o}">${o}</button>`).join('')}</div></div>${say('oder in eigenen Worten antworten.')}`;
  if (i.state === 'proposal') return `${head}<p class="p-lead">${i.reason}</p><div class="question"><h4>Vorschlag</h4>${i.suggestion}</div>
      <p class="hint">Vorgeschlagen vom Agenten der Karte „${byId[i.from].title}“.</p>
      <div class="actions"><button class="btn primary" data-act="accept">Übernehmen</button><button class="btn" data-act="dismiss">Verwerfen</button></div>
      ${say('oder den Vorschlag anpassen.')}`;
  if (i.state === 'working') return `${head}<p class="p-lead">${i.meta || ''}</p><div class="log">${i.log.map((l) => `<div>${l}</div>`).join('')}</div>${say('Hinweise an den Agenten, ohne ihn anzuhalten.')}`;
  return `${head}<p class="p-lead">${i.meta || ''}</p>${i.state === 'live' ? '<p class="hint">Ausgeliefert. Die Demo bleibt hier abrufbar.</p>' : ''}${say('Auftrag erteilen, umplanen, Fragen stellen.')}`;
}
function wireDetail(i) {
  panel.querySelector('.close').onclick = closeCard;
  panel.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => respond({ act: b.dataset.act })));
  panel.querySelectorAll('[data-answer]').forEach((b) => (b.onclick = () => respond({ answer: b.dataset.answer })));
  const v = panel.querySelector('video');
  if (!v) return;
  const btns = [...panel.querySelectorAll('.chapters button')];
  btns.forEach((b) => (b.onclick = () => { v.currentTime = +b.dataset.t; v.play(); }));
  v.ontimeupdate = () => { let cur = btns[0]; for (const b of btns) if (+b.dataset.t <= v.currentTime + 0.05) cur = b; btns.forEach((b) => b.classList.toggle('on', b === cur)); };
}
dim.onclick = () => focus && focus.type === 'card' && closeCard();

// ------------------------------------------------------------------ voice (scripted in the mock)
const ptt = document.getElementById('ptt'), ack = document.getElementById('ack');
let listening = null, audio = null, undoStack = null, ackTimer = null, newCards = 0;
function updateTarget() {
  const t = !focus ? 'Koordinator' : focus.type === 'project' ? `Projekt: ${byId[focus.id].title}` : `Agent: ${byId[focus.id].title}`;
  document.getElementById('target').innerHTML = `→ <b>${t}</b>`;
}
async function startListening() {
  if (listening) return;
  listening = { t0: performance.now() };
  ptt.classList.add('listening'); ptt.classList.remove('thinking');
  const v = panel.querySelector('video'); if (v && !v.paused) { v.pause(); listening.resume = v; }
  try {
    if (!audio) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = new AudioContext(), an = ctx.createAnalyser(); an.fftSize = 512;
      ctx.createMediaStreamSource(stream).connect(an); audio = { an, buf: new Uint8Array(512) };
    }
  } catch { audio = { fake: true }; }
  const meter = () => {
    if (!listening) return;
    let lvl;
    if (audio.fake) lvl = 0.3 + 0.25 * Math.abs(Math.sin(performance.now() / 140));
    else { audio.an.getByteTimeDomainData(audio.buf); let s = 0; for (const x of audio.buf) s += ((x - 128) / 128) ** 2; lvl = Math.min(1, Math.sqrt(s / audio.buf.length) * 6); }
    document.getElementById('mic').style.setProperty('--lvl', 1 + lvl * 0.45);
    requestAnimationFrame(meter);
  };
  meter();
}
function stopListening() {
  if (!listening) return;
  const held = performance.now() - listening.t0; listening = null;
  ptt.classList.remove('listening');
  if (held < 300) return;
  ptt.classList.add('thinking');
  setTimeout(() => { ptt.classList.remove('thinking'); respond(); }, 950);
}
function snapshot() { return items.map((i) => ({ ...i })); }
function restore(snap) {
  for (const s of snap) Object.assign(byId[s.id] || {}, s);
  for (const id of Object.keys(byId)) if (!snap.find((s) => s.id === id)) { items.splice(items.indexOf(byId[id]), 1); els[id].remove(); delete els[id]; delete byId[id]; }
  render();
}
function showAck(text, snap) {
  document.getElementById('ack-text').textContent = text;
  undoStack = snap; ack.classList.add('on'); clearTimeout(ackTimer);
  speak(text);
  ackTimer = setTimeout(() => ack.classList.remove('on'), 7000);
}
// Spoken confirmation: the default macOS voice via `say` (pre-rendered in acks/), the browser voice as fallback.
let voice = null;
function pickVoice() {
  const de = speechSynthesis.getVoices().filter((v) => v.lang.startsWith('de'));
  const novelty = /Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley/;
  voice = de.find((v) => /Premium|Enhanced|Siri/.test(v.name)) || de.find((v) => !novelty.test(v.name)) || de[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
let ackAudio = null;
function speak(text) {
  const plain = text.replace(/^Verstanden: /, '');
  speechSynthesis.cancel(); if (ackAudio) ackAudio.pause();
  // the confirmations the mock can produce are pre-rendered with `say`; anything else falls back to the browser voice
  if (typeof ACK_AUDIO !== 'undefined' && ACK_AUDIO[plain]) { ackAudio = new Audio(ACK_AUDIO[plain]); ackAudio.play().catch(() => {}); return; }
  const u = new SpeechSynthesisUtterance(plain);
  u.lang = 'de-DE'; if (voice) u.voice = voice; u.rate = 1.08;
  speechSynthesis.speak(u);
}
document.getElementById('undo').onclick = () => { if (undoStack) restore(undoStack); undoStack = null; ack.classList.remove('on'); };
async function respond(input = {}) {
  const snap = snapshot();
  const cur = focus && byId[focus.id];
  if (!focus) {
    const n = ++newCards, p = byId.ww;
    const card = { id: 'new' + n, parent: 'ww', w: 'W' + (9 + n), kind: 'feature', title: n === 1 ? 'Zählerstände als CSV exportieren' : 'Neuer Auftrag ' + n,
      meta: 'Aus deiner Spracheingabe angelegt', state: 'working', rx: 30 + ((n - 1) % 3) * 320, ry: 510, log: ['Auftrag verstanden', 'Plan-Dokument ergänzt', 'Implementierung beginnt …'] };
    p.h = Math.max(p.h, 680); items.push(card); byId[card.id] = card; render();
    els[card.id].classList.add('pop');
    showAck(`Verstanden: neue Karte „${card.title}“ im Projekt Warmwasser, ein Agent fängt an.`, snap);
    const b = itemBounds(card);
    await flyTo({ s: Math.max(cam.s, 0.7), x: innerWidth / 2 - (b.x + b.w / 2) * Math.max(cam.s, 0.7), y: innerHeight / 2 - (b.y + b.h / 2) * Math.max(cam.s, 0.7) }, 700);
    els[card.id].classList.add('flash');
    return;
  }
  if (focus.type === 'project') { showAck(`Verstanden: im Plan „${cur.title}“ vermerkt – W13 vor W11.`, snap); return; }
  if (cur.need === 'demo') {
    cur.state = 'approved'; delete cur.need;
    const g = byId.gutschrift; if (g.state === 'proposal') { g.state = 'planned'; g.meta = 'Aus dem Vorschlag übernommen'; }
    await closeCard(); render();
    els.rabatt.classList.add('flash'); els.gutschrift.classList.add('flash');
    showAck('Verstanden: Rabatt freigegeben. Die Gutschrift-Beschriftung kommt als eigener Bugfix.', snap);
    return;
  }
  if (cur.need === 'question') {
    const text = input.answer ? `„${input.answer}“. Der Agent macht weiter.`
      : cur.id === 'entsoe' ? 'Quellenhinweis unter jeder Preisgrafik. Der Agent macht weiter.' : 'Termin Donnerstag, 9 Uhr, mit dem Hausmeister. Der Agent bereitet die Konfiguration vor.';
    cur.state = 'working'; delete cur.need; cur.log = ['Antwort erhalten: ' + text.split('.')[0], 'Arbeit wird fortgesetzt …'];
    await closeCard(); render(); els[cur.id].classList.add('flash');
    showAck('Verstanden: ' + text, snap); return;
  }
  if (cur.state === 'proposal' && input.act === 'dismiss') {
    await closeCard();
    items.splice(items.indexOf(cur), 1); els[cur.id].remove(); delete els[cur.id]; delete byId[cur.id]; render();
    showAck('Verstanden: Vorschlag verworfen.', snap); return;
  }
  if (cur.state === 'proposal') {
    cur.state = 'planned'; cur.meta = 'Aus dem Vorschlag übernommen';
    await closeCard(); render(); els[cur.id].classList.add('flash');
    showAck('Verstanden: Vorschlag übernommen und eingeplant.', snap); return;
  }
  showAck(`Verstanden: an den Agenten von „${cur.title}“ weitergegeben.`, snap);
}
const mic = document.getElementById('mic');
mic.addEventListener('pointerdown', (e) => { e.preventDefault(); startListening(); });
addEventListener('pointerup', stopListening);

// ------------------------------------------------------------------ keys
let attnIdx = -1;
function nextAttention() {
  const list = items.filter(needsYou); if (!list.length) return;
  attnIdx = (attnIdx + 1) % list.length; open(list[attnIdx]);
}
document.getElementById('attention').onclick = () => { if (focus && focus.type === 'card') return; nextAttention(); };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) startListening(); return; }
  if (e.key === 'Escape') { if (focus?.type === 'card') closeCard(); else if (focus?.type === 'project') closeProject(); }
  if (focus?.type === 'card') return;
  if (e.key === '0') { focus = null; sheet.classList.remove('on'); updateTarget(); flyTo(overviewCam(), 700); }
  if (e.key === 'Tab') { e.preventDefault(); nextAttention(); }
}, true);
addEventListener('keyup', (e) => { if (e.code === 'Space') { e.preventDefault(); stopListening(); } }, true);
addEventListener('resize', () => drawOverlays());

// ------------------------------------------------------------------ start
render();
// Start at full size on the middle of the map; zooming out to the overview is a deliberate step (key 0).
{ const b = allBounds(); cam = { s: 1, x: innerWidth / 2 - (b.x + b.w / 2), y: 70 + (innerHeight - 180) / 2 - (b.y + b.h / 2) }; }
try { const saved = JSON.parse(localStorage.getItem('obeya-mock-cam') || 'null'); if (saved) cam = saved; } catch {}
applyCam();
</script>
