# Publishes site/ to GitHub Pages under obeya.si. Pages serves a branch only from / or /docs,
# so the site goes out through this workflow; the custom domain is set in the repository's
# Pages settings (a CNAME file is ignored for workflow deployments). The hero video, its
# captions, its chapters and the README's loop cut from it stay out of git: they are assets of
# the release `site-media`, fetched into site/media/ before the upload. scripts/hero-video/publish.ts replaces them and runs this workflow again.
# The sitemap is written here too (scripts/site-sitemap.ts), each page dated by its last commit,
# hence the whole history in the checkout; site/robots.txt points to it. The hero video plays in the
# player of Obeya's cards, built into site/player.js and site/player.css here (scripts/site-player.ts).
name: Pages

on:
  push:
    branches: [main]
    # with site-player.ts each file it builds site/player.js from, as site-player.test.ts checks
    paths:
      - 'site/**'
      - 'scripts/site-sitemap.ts'
      - 'scripts/site-player.ts'
      - 'src/server/demo-page.ts'
      - 'src/core/video-player.ts'
      - 'src/core/caption-pages.ts'
      - 'src/core/frame.ts'
      - 'src/core/player.css'
      - 'plugin/skills/demo/lib/locale.ts'
      - 'plugin/skills/demo/lib/subtitles.ts'
      - 'plugin/skills/demo/lib/timeline.ts'
      - 'plugin/skills/demo/lib/word-times.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - name: Write the sitemap
        run: bun scripts/site-sitemap.ts site https://obeya.si/
      - name: Build the video player
        run: bun scripts/site-player.ts site
      - name: Fetch the hero video
        run: gh release download site-media --pattern 'hero.*' --dir site/media
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
