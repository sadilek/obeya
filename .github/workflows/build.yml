# Builds Obeya on every platform it ships for, each on its own runner (no cross compilation, so the
# smoke test runs where the build ran). A push to main that changes code (not only docs or the site)
# builds the unsigned installers, checks the compiled server (scripts/check-binary.ts: a scratch
# canvas answers, with the version, a repository's own settings, Playwright among the resources and
# a script run on the binary's Bun), checks that the local demo voices install and speak on Linux, Windows and
# macOS, that a scratch Obeya stages on each of them (scripts/check-scratch.ts), and runs the tests
# and the type check on Linux, Windows and macOS; the installers stay a week as the
# run's artifacts. A tag v<version of package.json> does the same and then makes a draft release
# with every installer, SHA256SUMS and latest.json for the updater (scripts/release.ts), its notes
# the commits since the tag before; the owner publishes it, and installed apps then offer it. Update artifacts and their signatures come only with the secret
# TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, if the key has one).
# On a tag, the Macs' app is signed with the Developer ID and notarised, the ticket stapled to the
# DMG (scripts/build-app.ts), with the secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID and, for a team key, APPLE_NOTARY_ISSUER (docs/release.md);
# without them a tag fails rather than releasing an app macOS would not open. Run by hand with
# "sign", the workflow does that on any branch, to try the secrets before a tag. Windows and Linux
# stay unsigned; SHA256SUMS lists every file of the release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # what leaves the running code as it is (as INERT in src/core/inert.ts); path filters
    # do not apply to tags
    paths-ignore: ['docs/**', 'design/**', 'site/**', '**/*.md', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarise the macOS app, as on a tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # the suite on each platform Obeya runs on (scripts/test.ts scales its parallelism and timeouts
  # for Windows)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      # the demo voice's tests run its sidecars through uv, and ffmpeg makes their WAVs; setup-uv
      # tags only whole versions since v8. No cache: the sidecars' few dependencies come with
      # `uv run --with`, so there is no lock or requirements file to key one on.
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: false }
      - name: ffmpeg
        run: |
          command -v ffmpeg && exit
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: bun run test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          bun run test

  # the local demo voices Obeya installs on request (Kokoro, Piper) install and speak on each
  # platform, downloaded afresh (scripts/check-voice.ts)
  voices:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: false }
      - run: bun scripts/check-voice.ts

  # a scratch Obeya stages from a stage file alone on each platform, its dir and port claims where
  # that platform keeps them (scripts/check-scratch.ts)
  scratch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile
      - run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
      - run: bun scripts/check-scratch.ts

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: windows-x64 }
          # 22.04: an AppImage runs where the glibc is the one it was built with or newer
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SIGN_MACOS: ${{ startsWith(matrix.target, 'darwin') && (startsWith(github.ref, 'refs/tags/') || inputs.sign) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'app -> target' }
      - name: WebKitGTK and GStreamer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: bun install --frozen-lockfile
      - name: The Apple secrets are there
        if: env.SIGN_MACOS == 'true'
        env:
          HAVE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_NOTARY_KEY != '' && secrets.APPLE_NOTARY_KEY_ID != '' }}
        run: '[ "$HAVE" = true ] || { echo "::error::signing needs the secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_NOTARY_KEY and APPLE_NOTARY_KEY_ID (docs/release.md)"; exit 1; }'
      - name: The compiled server and the app around it
        run: bun scripts/build-app.ts
        env:
          APPLE_CERTIFICATE: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_NOTARY_KEY: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_NOTARY_KEY || '' }}
          APPLE_NOTARY_KEY_ID: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_NOTARY_ISSUER || '' }}
      - name: Smoke test of the compiled server
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          bun scripts/check-binary.ts "dist/obeya-$version-${{ matrix.target }}/obeya${{ runner.os == 'Windows' && '.exe' || '' }}"
      - run: bun scripts/release.ts collect ${{ matrix.target }} release
      - uses: actions/upload-artifact@v7
        with:
          name: obeya-${{ matrix.target }}
          path: release
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the notes need the history back to the tag before
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/download-artifact@v8
        with: { path: release, pattern: 'obeya-*', merge-multiple: true }
      - run: bun scripts/release.ts notes "$GITHUB_REF_NAME" notes.md
      - run: bun scripts/release.ts manifest release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # goes before the commits since the tag before (scripts/release.ts notes)
          NOTES: >-
            The Mac apps are signed and notarised. The Windows installer and the Linux packages are
            not signed: SmartScreen warns about the installer ("More info", then "Run anyway"). Every
            file's SHA-256 is in `SHA256SUMS`: `sha256sum --check --ignore-missing SHA256SUMS` beside
            the download, or `Get-FileHash Obeya-Windows-x64-setup.exe` in PowerShell.
            [Code signing policy](https://obeya.si/code-signing/)
        run: |
          { printf '%s\n\n' "$NOTES"; cat notes.md; } > body.md
          gh release create "$GITHUB_REF_NAME" --draft --latest --verify-tag --title "Obeya ${GITHUB_REF_NAME#v}" --notes-file body.md release/*
