# Builds Obeya on every platform it ships for, each on its own runner (no cross compilation, so the
# smoke test runs where the build ran). A push to main that changes code (not only docs or the site)
# builds the unsigned installers, checks the compiled server (scripts/check-binary.ts: a scratch
# canvas answers, with the version, a repository's own adapter, Playwright and the adapter kit
# from the resources) and runs the tests and the type check; the installers stay a week as the
# run's artifacts. A tag v<version of package.json> does the same and then makes a draft release
# with every installer, SHA256SUMS and latest.json for the updater (scripts/release.ts); the owner
# publishes it. Update artifacts and their signatures come only with the secret
# TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, if the key has one).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # what leaves the running code as it is (as INERT in src/server/self-update.ts); path filters
    # do not apply to tags
    paths-ignore: ['docs/**', 'design/**', 'site/**', '**/*.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      # the demo voice's tests run its sidecars through uv
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: bun test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          bun test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: windows-x64 }
          # 22.04: an AppImage runs where the glibc is the one it was built with or newer
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'app -> target' }
      - name: WebKitGTK and GStreamer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: bun install --frozen-lockfile
      - name: The compiled server and the app around it
        run: bun scripts/build-app.ts
      - name: Smoke test of the compiled server
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          bun scripts/check-binary.ts "dist/obeya-$version-${{ matrix.target }}/obeya${{ runner.os == 'Windows' && '.exe' || '' }}"
      - run: bun scripts/release.ts collect release
      - uses: actions/upload-artifact@v4
        with:
          name: obeya-${{ matrix.target }}
          path: release
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - uses: actions/download-artifact@v4
        with: { path: release, pattern: 'obeya-*', merge-multiple: true }
      - run: bun scripts/release.ts manifest release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Obeya ${GITHUB_REF_NAME#v}" --generate-notes release/*
