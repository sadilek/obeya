<!doctype html>
<!-- What the window shows until Obeya answers; then the shell (src/main.rs) loads the canvas. And while an update goes in. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Obeya</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f2ee; color: #75716a; font: 15px system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { html, body { background: #151412; color: #a39e94; } }
      body { display: grid; place-content: center; justify-items: center; gap: 16px; }
      img { width: 64px; height: 64px; animation: breathe 1.6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: .45; } }
    </style>
  </head>
  <body>
    <img src="logo.svg" alt="" />
    <div id="what"></div>
    <script>
      const de = navigator.language.startsWith('de');
      // ?updating: the shell installs an update (src/update.rs) and then starts the app again
      document.getElementById('what').textContent = location.search === '?updating' ? (de ? 'Obeya wird aktualisiert …' : 'Obeya is updating …') : de ? 'Obeya startet …' : 'Obeya is starting …';
    </script>
  </body>
</html>
