[package]
name = "obeya-app"
version = "0.1.0"
description = "Obeya: a spatial canvas for directing AI coding agents"
license = "MIT"
edition = "2021"

[[bin]]
name = "obeya"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
