[package]
name = "obeya-app"
version = "0.1.0"
description = "Obeya: a spatial canvas for directing AI coding agents"
license = "MIT"
edition = "2021"

[[bin]]
name = "obeya"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
sys-locale = "0.3"
cpal = "0.16"
ureq = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
x11-dl = "2.21"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
